<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Vinyl Record (Concentric Circles) -->
  <g fill="none" stroke="#ffffff">
    <!-- Outer Edge -->
    <circle cx="230" cy="200" r="160" stroke-width="6" />
    
    <!-- Groove Rings -->
    <circle cx="230" cy="200" r="140" stroke-width="2" />
    <circle cx="230" cy="200" r="120" stroke-width="1.5" />
    <circle cx="230" cy="200" r="105" stroke-width="1" />
    <circle cx="230" cy="200" r="85" stroke-width="2" />
    
    <!-- Center Label & Spindle -->
    <circle cx="230" cy="200" r="60" stroke-width="4" />
    <circle cx="230" cy="200" r="6" stroke-width="3" fill="#ffffff" />
  </g>

  <!-- Tonearm Assembly -->
  <!-- Base Pivot -->
  <circle cx="480" cy="110" r="28" fill="none" stroke="#ffffff" stroke-width="4" />
  <circle cx="480" cy="110" r="12" fill="none" stroke="#ffffff" stroke-width="3" />
  
  <!-- Curved Arm Shaft -->
  <path d="M 480 110 Q 430 190 350 250" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Minimal Cartridge / Stylus -->
  <rect x="315" y="245" width="38" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(35 334 254)" />
</svg>
